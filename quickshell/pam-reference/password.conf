# ============================================================
# REFERENCIA — nao sobrescreve o seu pam/password.conf existente.
# So pra comparar, ja que voce disse que ja tem um.
#
# Fica em ~/.config/quickshell/pam/password.conf (o "pam" no
# configDirectory do LockContext.qml e' relativo a raiz do shell).
#
# So senha, sem impressao digital/reconhecimento facial (nao
# mencionado, nao configurado). "required" = essa regra tem que
# passar. So uma regra e' o suficiente pro caso mais simples.
# ============================================================
auth required pam_unix.so
